  <text x="463" y="580" class="small">User.js</text>
  <text x="463" y="602" class="small">Product.js</text>
  <text x="463" y="624" class="small">Request.js</text>
  <text x="463" y="646" class="small">Transaction.js</text>
  <text x="463" y="668" class="small">Notification.js</text>

  <rect x="414" y="706" width="18" height="18" rx="3" ry="3" class="folderGreen"/>
  <text x="445" y="720" class="item">routes/</text>
  <text x="463" y="742" class="small">authRoutes.js</text>
  <text x="463" y="764" class="small">userRoutes.js</text>
  <text x="463" y="786" class="small">productRoutes.js</text>
  <text x="463" y="808" class="small">requestRoutes.js</text>
  <text x="463" y="830" class="small">transactionRoutes.js</text>
  <text x="463" y="852" class="small">adminRoutes.js</text>

  <rect x="414" y="888" width="18" height="18" rx="3" ry="3" class="folderGreen"/>
  <text x="445" y="902" class="item">middleware/</text>
  <text x="463" y="924" class="small">authMiddleware.js</text>
  <text x="463" y="946" class="small">adminMiddleware.js</text>
  <text x="463" y="968" class="small">uploadMiddleware.js</text>
  <text x="414" y="1002" class="small">server.js</text>
  <text x="414" y="1026" class="small">package.json</text>

