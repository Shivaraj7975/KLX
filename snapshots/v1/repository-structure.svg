  <text x="1175" y="320" class="item">.env.example</text>
  <text x="1175" y="348" class="item">.gitignore</text>
  <text x="1175" y="376" class="item">package.json</text>
  <text x="1175" y="404" class="item">package-lock.json</text>
  <text x="1175" y="460" class="item">frontend/</text>
  <text x="1175" y="488" class="item">backend/</text>
  <text x="1175" y="516" class="item">README.md</text>
  <text x="1175" y="544" class="item">SETUP_INSTRUCTIONS.md</text>
  <text x="1175" y="572" class="item">BACKEND_SETUP_SUMMARY.md</text>
  <text x="1175" y="628" class="item">Node.js / npm workspace</text>
  <text x="1175" y="656" class="item">root scripts</text>
  <text x="1175" y="684" class="item">shared config</text>

  <!-- simple connectors -->
  <path class="branch" d="M 230 218 L 230 206"/>
  <path class="branch" d="M 605 218 L 605 206"/>
  <path class="branch" d="M 1000 218 L 1000 206"/>
  <path class="branch" d="M 1350 218 L 1350 206"/>

  <!-- Legend -->
  <rect x="1020" y="862" width="470" height="150" rx="16" ry="16" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <text x="1255" y="895" text-anchor="middle" class="legendTitle">LEGEND</text>
  <rect x="1060" y="917" width="18" height="14" class="folderBlue" rx="3" ry="3"/>
  <text x="1090" y="929" class="small">Frontend</text>
  <rect x="1180" y="917" width="18" height="14" class="folderGreen" rx="3" ry="3"/>
  <text x="1210" y="929" class="small">Backend</text>
  <rect x="1300" y="917" width="18" height="14" class="folderOrange" rx="3" ry="3"/>
  <text x="1330" y="929" class="small">Docs</text>
  <rect x="1420" y="917" width="18" height="14" class="folderRed" rx="3" ry="3"/>
  <text x="1450" y="929" class="small">Root</text>
  <text x="1060" y="970" class="small">Folders and files are grouped by repository area to match the reference layout.</text>
  <text x="1060" y="995" class="small">Open this SVG in a browser or VS Code preview for the full image.</text>
</svg>
