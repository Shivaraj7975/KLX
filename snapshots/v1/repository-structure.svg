  <text x="138" y="606" class="small">Home.jsx</text>
  <text x="138" y="628" class="small">Login.jsx</text>
  <text x="138" y="650" class="small">Register.jsx</text>
  <text x="138" y="672" class="small">Dashboard.jsx</text>
  <text x="138" y="694" class="small">ProductDetails.jsx</text>
  <text x="138" y="716" class="small">AdminPanel.jsx</text>

