<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-label="Repository structure diagram for CLG project">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <style>
      .bg { fill: url(#bgGrad); }
      .title { font: 800 38px Arial, Helvetica, sans-serif; fill: #102a59; }
      .subtitle { font: 500 17px Arial, Helvetica, sans-serif; fill: #4b5563; letter-spacing: 2px; }
      .repo { font: 700 22px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .repoIcon { fill: #ffffff; }
      .panelTitle { font: 800 22px Arial, Helvetica, sans-serif; fill: #10324f; }
      .item { font: 500 17px Arial, Helvetica, sans-serif; fill: #22313f; }
      .small { font: 400 14px Arial, Helvetica, sans-serif; fill: #5c6b77; }
      .box { rx: 18; ry: 18; stroke-width: 2; }
      .panel { fill: #ffffff; stroke-width: 2.2; }
      .frontendPanel { fill: #f2f8ff; stroke: #6aa7ef; }
      .backendPanel { fill: #f4fbf0; stroke: #8bc34a; }
      .docsPanel { fill: #fff8ec; stroke: #efb34b; }
      .rootPanel { fill: #fff7f8; stroke: #f08f99; }
      .rootBar { fill: #0f2d63; stroke: #0f2d63; }
      .folderBlue { fill: #cfe5ff; }
      .folderGreen { fill: #d9efc6; }
      .folderOrange { fill: #ffe5b8; }
      .folderRed { fill: #ffd6d9; }
      .line { stroke: #1f2937; stroke-width: 2.5; fill: none; }
      .branch { stroke: #6b7280; stroke-width: 2; fill: none; }
      .legendTitle { font: 800 18px Arial, Helvetica, sans-serif; fill: #263238; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1080"/>

  <text x="800" y="52" text-anchor="middle" class="title">CLG Project</text>
  <text x="800" y="86" text-anchor="middle" class="subtitle">REPOSITORY STRUCTURE</text>

  <rect class="box rootBar" x="560" y="110" width="480" height="54" rx="14" ry="14"/>
  <rect class="repoIcon" x="586" y="124" width="30" height="24" rx="3" ry="3"/>
  <path d="M 586 130 L 602 130 L 607 124 L 616 124 L 621 130 L 616 130 L 610 124 L 598 124 L 594 130 Z" fill="#ffffff"/>
  <text x="800" y="145" text-anchor="middle" class="repo">clg_project</text>

  <path class="line" d="M 800 164 L 800 184"/>
  <path class="line" d="M 200 184 L 1400 184"/>
  <path class="branch" d="M 230 184 L 230 218"/>
  <path class="branch" d="M 605 184 L 605 218"/>
  <path class="branch" d="M 1000 184 L 1000 218"/>
  <path class="branch" d="M 1350 184 L 1350 218"/>

