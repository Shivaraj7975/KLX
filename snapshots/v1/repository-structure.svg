  <text x="835" y="248" class="panelTitle">docs/</text>
  <text x="836" y="296" class="item">README.md</text>
  <text x="836" y="324" class="item">SETUP_INSTRUCTIONS.md</text>
  <text x="836" y="352" class="item">BACKEND_SETUP_SUMMARY.md</text>
  <text x="836" y="408" class="item">graph LR.mmd</text>
  <text x="836" y="436" class="item">graph TD.mmd</text>
  <text x="836" y="464" class="item">repository-structure.svg</text>
  <text x="836" y="520" class="item">frontend-structure notes</text>
  <text x="836" y="548" class="item">backend-structure notes</text>
  <text x="836" y="576" class="item">architecture diagrams</text>
  <text x="836" y="632" class="item">SRS / planning docs</text>
  <text x="836" y="660" class="item">API documentation</text>
  <text x="836" y="688" class="item">project summaries</text>

